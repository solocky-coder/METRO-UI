name: Apply DYSEKT-SF source fixes

on:
  push:
    branches: [ feature/dysektsf-sonobus-engine ]

permissions:
  contents: write

jobs:
  apply-source-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source fixes
        if: ${{ hashFiles('DYSEKT_SOURCE_FIXES_PENDING') != '' }}
        shell: bash
        env:
          DYSEKT_PATCH_B64: >-
            
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import base64, zlib, os, pathlib
          patch = zlib.decompress(base64.b64decode(os.environ["DYSEKT_PATCH_B64"])).decode("utf-8")
          pathlib.Path("/tmp/dysektsf_fixes.patch").write_text(patch, encoding="utf-8")
          PYTHON
          git apply --check -p1 /tmp/dysektsf_fixes.patch
          git apply -p1 /tmp/dysektsf_fixes.patch
          git diff --check

      - name: Commit fixes
        if: ${{ hashFiles('DYSEKT_SOURCE_FIXES_PENDING') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/network/MetroNetworkAudio.h \
            src/network/MetroNetworkAudio.cpp \
            src/network/NetworkAudioTrackRouter.h \
            src/sequencer/SequencerTrack.h \
            src/sequencer/SequencerEngine.h \
            src/sequencer/SequencerEngine.cpp
          git rm -- DYSEKT_SOURCE_FIXES_PENDING
          git commit -m "Fix DYSEKT-SF network source routing identity"
          git push origin HEAD:feature/dysektsf-sonobus-engine
