name: One-shot peer name fix

on:
  push:
    branches:
      - fix/network-source-peer-name

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/network-source-peer-name
          fetch-depth: 0
      - name: Patch source metadata ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/network/MetroNetworkAudio.cpp')
          s = p.read_text()
          old = '''                        for (auto& source : self->sources)\n                        {\n                            if (auto peer = self->findPeer (endpoint.get()))\n                            {\n                                source.user = peer->user;\n                                if (peer->group.isNotEmpty()) source.group = peer->group;\n                            }\n                        }'''
          new = '''                        if (auto peer = self->findPeer (endpoint.get()))\n                        {\n                            for (auto& source : self->sources)\n                            {\n                                auto* runtime = self->findRuntime (source.sourceKey);\n                                if (runtime == nullptr || runtime->endpoint == nullptr)\n                                    continue;\n\n                                // A peer can expose multiple AOO sources. Only update\n                                // sources belonging to the peer that just joined; do not\n                                // overwrite every source with the last peer's name.\n                                if (runtime->endpoint->sin_addr.s_addr != endpoint->sin_addr.s_addr)\n                                    continue;\n\n                                source.user = peer->user;\n                                if (peer->group.isNotEmpty()) source.group = peer->group;\n                            }\n                        }'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/network/MetroNetworkAudio.cpp
          git commit -m "fix: keep network source names tied to their peer"
          git push
