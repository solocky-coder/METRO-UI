name: One-shot source list readability fix

on:
  push:
    branches:
      - fix/network-source-list-readability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/network-source-list-readability
          fetch-depth: 0
      - name: Improve source list readability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/standalone/NetworkAudioSettingsComponent.h')
          s = p.read_text()
          s = s.replace('•', '|')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/standalone/NetworkAudioSettingsComponent.h
          git commit -m "fix: remove unsupported source list glyphs"
          git push
