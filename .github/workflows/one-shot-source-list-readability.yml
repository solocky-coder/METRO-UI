name: One-shot source list readability fix

on:
  push:
    branches:
      - fix/network-source-list-readability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/network-source-list-readability
          fetch-depth: 0
      - name: Improve source list readability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/standalone/NetworkAudioSettingsComponent.h')
          s = p.read_text()
          s = s.replace('sourceList.setOutlineThickness (1);\n        addAndMakeVisible (sourceList);', 'sourceList.setOutlineThickness (1);\n        sourceList.setRowHeight (48);\n        addAndMakeVisible (sourceList);', 1)
          s = s.replace('•', '|')
          s = s.replace('juce::Font (14.0f, juce::Font::bold)', 'juce::Font (17.0f, juce::Font::bold)')
          s = s.replace('juce::Font (11.0f)', 'juce::Font (13.0f)')
          s = s.replace('g.setColour (juce::Colours::grey);\n            g.setFont (juce::Font (13.0f));', 'g.setColour (juce::Colours::lightgrey);\n            g.setFont (juce::Font (13.0f));', 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/standalone/NetworkAudioSettingsComponent.h
          git commit -m "fix: improve network source list readability"
          git push
