name: Fix Network Audio UI

on:
  push:
    branches:
      - fix/network-audio-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/network-audio-ui

      - name: Patch settings integration
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          shim = Path('src/standalone/NetworkAudioSettingsShim.h')
          text = shim.read_text()
          old = '''explicit MetroNetworkAudioSettingsSelector (juce::AudioDeviceManager& deviceManager,
                                                 int, int, int, int, bool, bool, bool, bool)
        : ::NetworkAudioSettingsComponent (
#if DYSEKT_HAS_AOO
              deviceManager, &metro_network_audio_settings::sharedNetworkAudio()
#else
              deviceManager, nullptr
#endif
          )'''
          new = '''explicit MetroNetworkAudioSettingsSelector (juce::AudioDeviceManager& deviceManager,
                                                 ::MetroNetworkAudio* networkAudio)
        : ::NetworkAudioSettingsComponent (deviceManager, networkAudio)'''
          if old not in text:
              raise SystemExit('shim constructor replacement failed')
          shim.write_text(text.replace(old, new, 1))

          main = Path('src/standalone/MainWindow.h')
          text = main.read_text()
          if '#include "NetworkAudioSettingsComponent.h"' not in text:
              raise SystemExit('MainWindow include not found')
          text = text.replace('#include "NetworkAudioSettingsComponent.h"', '#include "NetworkAudioSettingsShim.h"', 1)
          old_construct = 'auto* comp = new NetworkAudioSettingsComponent (deviceManager, networkAudio.get());'
          new_construct = 'auto* comp = new MetroNetworkAudioSettingsSelector (deviceManager, networkAudio.get());'
          if old_construct not in text:
              raise SystemExit('MainWindow construction not found')
          text = text.replace(old_construct, new_construct, 1)
          main.write_text(text)
          PY

      - name: Verify source changes
        run: |
          grep -n "MetroNetworkAudioSettingsSelector" src/standalone/MainWindow.h src/standalone/NetworkAudioSettingsShim.h
          grep -n "Create Audio Track" src/standalone/NetworkAudioSettingsShim.h

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/standalone/MainWindow.h src/standalone/NetworkAudioSettingsShim.h
          git commit -m "fix: wire network track UI into audio settings"
          git push origin HEAD:fix/network-audio-ui
          git rm .github/workflows/fix-network-audio-ui.yml
          git commit -m "chore: remove one-shot UI patch workflow"
          git push origin HEAD:fix/network-audio-ui
