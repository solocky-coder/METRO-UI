name: Fix Network Audio UI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Patch settings integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          shim = Path('src/standalone/NetworkAudioSettingsShim.h')
          text = shim.read_text()
          old = '''explicit MetroNetworkAudioSettingsSelector (juce::AudioDeviceManager& deviceManager,
                                                 int, int, int, int, bool, bool, bool, bool)
        : ::NetworkAudioSettingsComponent (
#if DYSEKT_HAS_AOO
              deviceManager, &metro_network_audio_settings::sharedNetworkAudio()
#else
              deviceManager, nullptr
#endif
          )'''
          new = '''explicit MetroNetworkAudioSettingsSelector (juce::AudioDeviceManager& deviceManager,
                                                 ::MetroNetworkAudio* networkAudio)
        : ::NetworkAudioSettingsComponent (deviceManager, networkAudio)'''
          if old in text:
              text = text.replace(old, new, 1)
          marker = '#define AudioDeviceSelectorComponent MetroNetworkAudioSettingsSelector'
          if '#define NetworkAudioSettingsComponent MetroNetworkAudioSettingsSelector' not in text:
              text = text.replace(marker, marker + '\n#define NetworkAudioSettingsComponent MetroNetworkAudioSettingsSelector', 1)
          shim.write_text(text)

          for name in ('dummy', 'dummy2', 'x', 'dummy3'):
              p = Path(name)
              if p.exists(): p.unlink()
          PY
      - name: Verify source changes
        run: |
          grep -n "MetroNetworkAudioSettingsSelector" src/standalone/NetworkAudioSettingsShim.h
          grep -n "NetworkAudioSettingsComponent MetroNetworkAudioSettingsSelector" src/standalone/NetworkAudioSettingsShim.h
          grep -n "Create Audio Track" src/standalone/NetworkAudioSettingsShim.h
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: wire network track UI into audio settings"
          git push origin HEAD:main
          git rm .github/workflows/fix-network-audio-ui.yml
          git commit -m "chore: remove one-shot UI patch workflow"
          git push origin HEAD:main
