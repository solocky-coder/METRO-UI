name: One-shot larger source list fonts

on:
  push:
    branches:
      - fix/network-source-list-readability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/network-source-list-readability
          fetch-depth: 0
      - name: Increase source list font sizes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/standalone/NetworkAudioSettingsComponent.h')
          s = p.read_text()
          s = s.replace('sourceList.setRowHeight (48);', 'sourceList.setRowHeight (64);', 1)
          s = s.replace('g.setFont (juce::Font (17.0f, juce::Font::bold));\n            g.drawText (name, 10, 3, width - 20, height / 2,', 'g.setFont (juce::Font (22.0f, juce::Font::bold));\n            g.drawText (name, 10, 3, width - 20, height / 2,', 1)
          s = s.replace('g.setFont (juce::Font (13.0f));\n            g.drawText (details, 10, height / 2, width - 20, height / 2 - 2,', 'g.setFont (juce::Font (16.0f));\n            g.drawText (details, 10, height / 2, width - 20, height / 2 - 2,', 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/standalone/NetworkAudioSettingsComponent.h
          git commit -m "fix: make network source list fonts larger"
          git push
