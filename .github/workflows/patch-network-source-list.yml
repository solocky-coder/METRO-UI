name: Patch network source list

on: [push]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch header
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/standalone/NetworkAudioSettingsComponent.h')
          s = p.read_text()
          old = '''        int getNumRows() override\n        {\n#if DYSEKT_HAS_AOO\n            return owner != nullptr ? (int) owner->getSources().size() : 0;\n#else\n            return 0;\n#endif\n        }\n'''
          new = '''        int getNumRows() override\n        {\n#if DYSEKT_HAS_AOO\n            if (owner == nullptr)\n                return 0;\n\n            const auto sources = owner->getSources();\n            int count = 0;\n            for (const auto& source : sources)\n                if (source.online)\n                    ++count;\n            return count;\n#else\n            return 0;\n#endif\n        }\n'''
          if old not in s: raise SystemExit('row block not found')
          s=s.replace(old,new,1)
          old = '''            const auto sources = owner->getSources();\n            if (! juce::isPositiveAndBelow (rowNumber, (int) sources.size()))\n                return;\n\n            if (rowIsSelected)\n                g.fillAll (juce::Colour (0xFF242430));\n\n            const auto& s = sources[(size_t) rowNumber];\n'''
          new = '''            const auto sources = owner->getSources();\n            const MetroNetworkAudio::SourceInfo* source = nullptr;\n            int visibleRow = 0;\n            for (const auto& candidate : sources)\n            {\n                if (! candidate.online)\n                    continue;\n                if (visibleRow++ == rowNumber)\n                {\n                    source = &candidate;\n                    break;\n                }\n            }\n            if (source == nullptr)\n                return;\n\n            if (rowIsSelected)\n                g.fillAll (juce::Colour (0xFF242430));\n\n            const auto& s = *source;\n'''
          if old not in s: raise SystemExit('paint block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/standalone/NetworkAudioSettingsComponent.h
          git diff --cached --quiet && exit 0
          git commit -m 'fix: hide offline network sources'
          git push
